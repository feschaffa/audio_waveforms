group 'com.simform.audio_waveforms'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace "com.simform.audio_waveforms"
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation("androidx.multidex:multidex:2.0.1")
    // Migrated off legacy com.google.android.exoplayer2 (last released Aug
    // 2023, now unmaintained) to androidx.media3, its actively maintained
    // successor. On a Samsung S926B (Android 16 / Exynos s5e9945), playback
    // with legacy ExoPlayer 2.19.1 silently stalled forever during AAC
    // decode - the codec reached RUNNING and configured an AudioTrack, but
    // Player.Listener never reported a single state change, so preparePlayer
    // never resolved. Media3 receives ongoing fixes for exactly this kind of
    // new-Android/codec-resource-negotiation issue.
    implementation "androidx.media3:media3-exoplayer:1.4.1"
}
